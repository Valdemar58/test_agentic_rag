# ДАННЫЕ СИНТЕТИЧЕСКИЕ. Пример формата голден-сета (§10.1 ТЗ) на синтетическом корпусе
# (`data/corpus`, генератор scripts/make_synthetic_corpus.py). Реальный сет по экспорту заказчика
# лежит рядом в `eval/golden_set.yaml` и в git не попадает: вопросы и эталоны содержат реквизиты
# документов организации. Квоты категорий здесь не выполняются — это образец полей, а не сет.
#
# Поля вопроса: id, category, question, expected_answer, expected_doc_ids, notes (ТЗ §10.1);
# follow_up / follow_up_expected — второй ход сценария clarification; derived: true — ответ
# требует расчёта из значений документа и данных пользователя.

corpus: data/corpus
synthetic: true

questions:
  - id: simple-01
    category: simple
    question: До какого числа подразделения сдают ежемесячный отчёт о выполнении плановых показателей?
    expected_answer: >-
      До 10 числа месяца, следующего за отчётным, через систему электронного документооборота
      (приказ № 173). Порядок «до 5 числа в бумажном виде» из приказа № 109 отменён.
    expected_doc_ids:
      - 40f136d0-0e97-539c-b4f5-69108169c8a7
    notes: Проверяет, что агент отвечает по действующему приказу, а не по отменённому.

  - id: multi_doc-01
    category: multi_doc
    question: Какие документы устанавливают порядок выдачи средств индивидуальной защиты и кто их поставляет?
    expected_answer: >-
      Обязанность работодателя обеспечить работников СИЗ — Положение об охране труда (приказ № 144);
      поставка СИЗ — договор № Д-1 с приложением-спецификацией.
    expected_doc_ids:
      - aef446c9-91e5-5862-9ea7-a705268e052e
      - 4db1cd1d-b10b-501e-a455-27df2a3c243e
    notes: Ответ требует и ЛНА, и договора.

  - id: duplicated-01
    category: duplicated
    question: Как часто проводится повторный инструктаж по охране труда?
    expected_answer: Не реже одного раза в шесть месяцев; проводит руководитель подразделения.
    expected_doc_ids:
      - aef446c9-91e5-5862-9ea7-a705268e052e
    notes: Одна и та же норма есть в Положении об охране труда и в служебной записке об итогах инструктажей.

  - id: no_answer-01
    category: no_answer
    question: Какая компенсация предусмотрена за использование личного велосипеда для служебных поездок?
    expected_answer: "Явный отказ: в документах такого правила нет; ничего не выдумано."
    expected_doc_ids: []
    notes: В корпусе темы нет.

  - id: contradiction-01
    category: contradiction
    question: В каком виде сдаётся ежемесячный отчёт — в бумажном или электронном?
    expected_answer: >-
      В электронном: приказ № 173 отменил бумажный порядок приказа № 109. Правильный ответ называет
      действующий документ и упоминает, что прежний отменён.
    expected_doc_ids:
      - 40f136d0-0e97-539c-b4f5-69108169c8a7
    notes: Отменённый приказ № 109 отвечает на тот же вопрос иначе.

  - id: clarification-01
    category: clarification
    question: Какие инструктажи по охране труда проводятся при приёме на работу?
    expected_answer: Вводный инструктаж проводит специалист по охране труда.
    follow_up: А кто проводит повторный?
    follow_up_expected: Руководитель подразделения, не реже одного раза в шесть месяцев.
    expected_doc_ids:
      - aef446c9-91e5-5862-9ea7-a705268e052e
    notes: Уточнение без повторного названия темы — проверяет переписывание запроса (FR-6).

  - id: simple-02
    category: simple
    question: Я прошёл повторный инструктаж 3 марта. Когда нужно пройти следующий?
    expected_answer: >-
      Не позднее 3 сентября: повторный инструктаж проводится не реже одного раза в шесть месяцев.
      Допустим ответ с явным расчётом от названной даты.
    expected_doc_ids:
      - aef446c9-91e5-5862-9ea7-a705268e052e
    derived: true
    notes: Величины «3 сентября» в документе нет — она считается из периодичности и даты пользователя.
