# Конфиг экспорт-скрипта. Скопируйте в config.yaml и заполните tessa.base_url.
# Логин и пароль в этот файл НЕ пишутся: они берутся из TESSA_USERNAME (формат ДОМЕН\пользователь)
# и TESSA_PASSWORD — из переменных окружения процесса (в Docker: docker run -e …) либо из файла
# .env рядом с конфигом или в каталоге запуска. Переменная процесса важнее файла.

tessa:
  base_url: https://tessa.example.local
  verify_tls: false          # у заказчика нет CA сервера Тессы; true — только вместе с ca_bundle
  ca_bundle: null            # путь к корпоративному CA; если задан, проверка идёт по нему
  tessa_version: "4.2"
  timeout_seconds: 60
  max_retries: 2

external:
  # В Docker-образе эти пути уже заполнены при сборке. Менять не нужно.
  # Вне контейнера каталоги берутся из первого сработавшего источника:
  #   1) эти параметры, 2) переменные TESSA_SDK_PATH и CARD_SERVICE_PATH (в том числе из .env),
  #   3) пакеты tessa_client и robot_skills, установленные в окружение.
  # Внутри каталога ожидается src/<пакет>. Если пути живут в .env, секцию можно убрать целиком.
  tessa_sdk_path: /opt/external/tessa_sdk
  card_service_path: /opt/external/robot_skills

seed_file: seed_cards.yaml   # относительно каталога конфига
output_dir: /output          # в Docker сюда монтируется папка результата
archive_name: tessa_export.zip

traversal:
  max_depth: 2               # глубина рекурсии от seed-документа
  # Первый запуск делается с запасом: по экспорту 2026-09-14 полное замыкание глубины 2 ≈ 350
  # документов. Затем лишнее отмечается в documents_review.csv и уходит в exclude_rules.
  max_docs: 400
  directions: [outgoing, incoming]

# Правила исключения. Заполняются после ручного отбора по documents_review.csv:
# исключённая карточка не скачивается, и её связи дальше не раскрываются.
# Seed-карточки защищены от критериев по типу/виду/полю (они выбраны явно); чтобы правило
# действовало и на seed (например, документы с ограничениями), добавьте applies_to_seed: true.
# Явный список card_ids действует всегда.
# Примеры:
#   - reason: "первичные документы ЭДО"
#     card_type_names: [PrimaryDocumentMKC, IncomingEDO]
#   - reason: "отобрано вручную 2026-09-20"
#     card_ids: ["00000000-0000-0000-0000-000000000000"]
#   - reason: "по полю"
#     field: DocumentCommonInfo.StatusID
#     values: ["00000000-0000-0000-0000-000000000000"]
# Решение заказчика 2026-09-15 (сценарий B по разбору полной выгрузки): бухгалтерские документы,
# приходящие из договоров, в корпус не входят. Seed-карточки этих типов остаются (защита seed).
exclude_rules:
  - reason: "первичные документы и пакеты ЭДО (счета, УПД, акты об оказании услуг, ведомости)"
    card_type_names: [PrimaryDocumentMKC, IncomingEDO]
  - reason: "акты сверки взаиморасчётов"
    card_type_names: [ActReconciliationMKC]

files:
  allowed_extensions: [pdf, docx, xlsx, pptx, png, jpg, jpeg, tif, tiff, bmp, gif]
  # doc и xls пока не обрабатываются (решение заказчика). Чтобы включить — добавьте сюда.

# Ориентиры покрытия из раздела 8.2 ТЗ. Дефицит — предупреждение в отчёте, не ошибка.
# Категории 8.2 содержательные (решение заказчика 2026-09-14): регэкспы применяются к виду документа
# (DocTypeTitle), типу карточки и теме (Subject); приказ «Об утверждении Инструкции…» считается
# и в «Приказы», и в «Инструкции». В индекс идёт только категория Тессы (DocTypeTitle).
coverage:
  coverage_kind_map:
    "Приказы": ["приказ"]
    "Положения / ЛНА": ["положени", "регламент", "правил", "\\bпвтр\\b", "политик", "стандарт", "\\bлна\\b"]
    "Инструкции": ["инструкц"]
    "Договоры": ["договор", "соглашени", "контракт"]
    "Акты": ["\\bакт(а|ы|ов|е|у|ом|ах|ами)?\\b"]
    "Служебные записки": ["служебн", "записк"]

# Статус документа для фильтра «только действующие». Три признака карточки независимы:
# StatusID (справочник; есть у приказов и договоров), StateID/StateName (состояние маршрута; есть у всех),
# статус согласования. Правило: cancelled — StatusID из cancelled_status_ids или StateID из
# cancelled_state_ids; иначе active — StateID из active_state_ids; иначе draft (в работе / не вступил в силу).
# Состояния Тессы (StateID → StateName): 0 Draft, 1 Active (на согласовании), 2 Approved, 3 Disapproved,
# 4 Editing, 5 Canceled, 6 Registered, 7 Registration, 8 Signed, 9 Declined, 10 Signing, 11 На исполнении,
# 12 Исполнено, 13 Списан в дело, 14 Обработка замечаний, 15 ОДОУ, 16 Ожидание поступления из Диадок,
# 17 Аннулирован, 18 Добавление скана, 19 На хранении, 20 Отправляется, 21 На подтверждении аннулирования.
status:
  cancelled_status_ids: ["de9d3b6d-532b-4cb8-aa7b-e055e8986e48"]   # StatusNameStatus = Отмененный
  cancelled_state_ids: [5, 17, 21]
  active_state_ids: [6, 8, 11, 12, 13, 18, 19]

# Синхронизация приказов: `tessa-export orders` (запрос заказчика 2026-09-18, вне ТЗ).
# Перечень приказов берётся из представления Тессы — API отдаёт списки карточек только так.
# Какое представление подходит, покажет `tessa-export views --config config.yaml`; колонки и
# параметры выбранного — `tessa-export views --config config.yaml --alias ALIAS`.
# Уже выгруженные карточки при повторном прогоне не запрашиваются (сверка по manifest.json
# в каталоге результата), поэтому каталог между прогонами менять не нужно.
orders:
  view_alias: OrderMKCDocuments_09062025   # представление приказов (указано заказчиком 2026-09-18)
  subset: null               # имя подмножества представления, если оно есть
  # Фильтры представления в том же виде, в каком их шлёт веб-клиент Тессы (F12 → get-data):
  # parameters:
  #   - name: DocType
  #     operand: Equality
  #     values:
  #       - value: "00000000-0000-0000-0000-000000000000"
  #         text: "Приказ"
  parameters: []
  id_column: DocID           # колонка со ссылкой на карточку документа
  state_column: StateID      # колонка состояния маршрута; null — если её в представлении нет
  # Выгружаются только эти состояния: 6 = $KrStates_Doc_Registered «Зарегистрировано», то есть
  # действующие приказы. Так в выгрузку не попадают проекты и несогласованные документы.
  # Карточка без StateID тоже не выгружается: её состояние не подтверждено.
  include_state_ids: [6]
  exclude_state_ids: []      # дополнительный чёрный список, если нужно убрать что-то из белого
  # Клиентский фильтр строк, если представление отдаёт не только приказы:
  # match:
  #   DocTypeName: ["приказ"]
  match: {}
  sort_column: null          # колонка сортировки — страницы становятся устойчивыми
  sort_descending: false
  page_limit: 200
  max_pages: 200             # предохранители: сколько страниц и документов брать максимум
  max_documents: 5000
  max_depth: 0               # 0 — только сами приказы, связанные документы не выгружаются

log_level: INFO
