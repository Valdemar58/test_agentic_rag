# Конфиг экспорт-скрипта. Скопируйте в config.yaml и заполните tessa.base_url.
# Логин и пароль НЕ пишутся в файл: они берутся из переменных окружения
# TESSA_USERNAME (формат ДОМЕН\пользователь) и TESSA_PASSWORD.

tessa:
  base_url: https://tessa.example.local
  verify_tls: false          # у заказчика нет CA сервера Тессы; true — только вместе с ca_bundle
  ca_bundle: null            # путь к корпоративному CA; если задан, проверка идёт по нему
  tessa_version: "4.2"
  timeout_seconds: 60
  max_retries: 2

external:
  # В Docker-образе эти пути уже заполнены при сборке. Менять не нужно.
  tessa_sdk_path: /opt/external/tessa_sdk
  card_service_path: /opt/external/robot_skills

seed_file: seed_cards.yaml   # относительно каталога конфига
output_dir: /output          # в Docker сюда монтируется папка результата
archive_name: tessa_export.zip

traversal:
  max_depth: 2               # глубина рекурсии от seed-документа
  # Первый запуск делается с запасом: по экспорту 2026-09-14 полное замыкание глубины 2 ≈ 350
  # документов. Затем лишнее отмечается в documents_review.csv и уходит в exclude_rules.
  max_docs: 400
  directions: [outgoing, incoming]

# Правила исключения. Заполняются после ручного отбора по documents_review.csv:
# исключённая карточка не скачивается, и её связи дальше не раскрываются.
# Примеры:
#   - reason: "первичные документы ЭДО"
#     card_type_names: [PrimaryDocumentMKC, IncomingEDO]
#   - reason: "отобрано вручную 2026-09-20"
#     card_ids: ["00000000-0000-0000-0000-000000000000"]
#   - reason: "по полю"
#     field: DocumentCommonInfo.StatusID
#     values: ["00000000-0000-0000-0000-000000000000"]
exclude_rules: []

files:
  allowed_extensions: [pdf, docx, xlsx, pptx, png, jpg, jpeg, tif, tiff, bmp, gif]
  # doc и xls пока не обрабатываются (решение заказчика). Чтобы включить — добавьте сюда.

# Ориентиры покрытия из раздела 8.2 ТЗ. Дефицит — предупреждение в отчёте, не ошибка.
# Категории 8.2 содержательные (решение заказчика 2026-09-14): регэкспы применяются к виду документа
# (DocTypeTitle), типу карточки и теме (Subject); приказ «Об утверждении Инструкции…» считается
# и в «Приказы», и в «Инструкции». В индекс идёт только категория Тессы (DocTypeTitle).
coverage:
  coverage_kind_map:
    "Приказы": ["приказ"]
    "Положения / ЛНА": ["положени", "регламент", "правил", "\\bпвтр\\b", "политик", "стандарт", "\\bлна\\b"]
    "Инструкции": ["инструкц"]
    "Договоры": ["договор", "соглашени", "контракт"]
    "Акты": ["\\bакт(а|ы|ов|е|у|ом|ах|ами)?\\b"]
    "Служебные записки": ["служебн", "записк"]

# Статус документа для фильтра «только действующие». Три признака карточки независимы:
# StatusID (справочник; есть у приказов и договоров), StateID/StateName (состояние маршрута; есть у всех),
# статус согласования. Правило: cancelled — StatusID из cancelled_status_ids или StateID из
# cancelled_state_ids; иначе active — StateID из active_state_ids; иначе draft (в работе / не вступил в силу).
# Состояния Тессы (StateID → StateName): 0 Draft, 1 Active (на согласовании), 2 Approved, 3 Disapproved,
# 4 Editing, 5 Canceled, 6 Registered, 7 Registration, 8 Signed, 9 Declined, 10 Signing, 11 На исполнении,
# 12 Исполнено, 13 Списан в дело, 14 Обработка замечаний, 15 ОДОУ, 16 Ожидание поступления из Диадок,
# 17 Аннулирован, 18 Добавление скана, 19 На хранении, 20 Отправляется, 21 На подтверждении аннулирования.
status:
  cancelled_status_ids: ["de9d3b6d-532b-4cb8-aa7b-e055e8986e48"]   # StatusNameStatus = Отмененный
  cancelled_state_ids: [5, 17, 21]
  active_state_ids: [6, 8, 11, 12, 13, 18, 19]

log_level: INFO
