[project]
name = "tessa-export"
version = "0.1.3"
description = "Экспорт голден-корпуса документов из СЭД Тесса (раздел 8 ТЗ)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    # Зависимости SDK Тессы (сам SDK подключается по пути из конфига, в пакет не входит)
    "httpx>=0.28,<1",
    "structlog>=24.1",
    # Smoke-парсинг файлов и признаки корпуса (раздел 8.3)
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pillow>=10.0",
]

[project.scripts]
tessa-export = "tessa_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessa_export"]
