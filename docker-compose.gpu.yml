# Дополнение к docker-compose.yml для RUNTIME_DEVICE=cuda: reranker и эмбеддинг запроса на GPU этой
# машины (LLM при этом работает на другом сервере, карта свободна). scripts/stack.py подключает файл
# сам, когда в конфиге устройство рантайма — cuda. Отдельный тег образа: CPU-образ остаётся как был.

services:
  mcp-server:
    image: agentic-rag-app:cuda
    build:
      args:
        # torch из uv.lock как есть (Linux: PyPI-сборка с CUDA 13, нужен драйвер NVIDIA ≥ 580)
        TORCH_VARIANT: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
