# Единый конфиг стенда и приложения (NFR-4): модели, стенд, инжест, поиск, агент, UI, eval.
# Секреты, учётные записи, URL сервисов и пути к внешнему коду сюда не попадают — они читаются
# из переменных окружения (.env, см. .env.example и src/common/settings.py).

gpu:
  # Бюджет VRAM целевой карты приёмки (RTX 3080, 12 ГиБ). Действует на любой карте: scripts/stack.py
  # читает фактический объём памяти GPU и пересчитывает долю --gpu-memory-utilization так, чтобы
  # vLLM получал одинаковый объём в гибибайтах и на 12 ГиБ, и на 16 ГиБ карте разработки.
  vram_budget_gib: 12.0
  # Сколько из бюджета отдаётся серверу vLLM (веса + активации + KV-кэш). Остаток бюджета —
  # контекст CUDA, драйвер и запас. Qwen3-8B AWQ: веса 5,7 ГиБ, KV-кэш ~144 КиБ/токен →
  # при 10,5 ГиБ остаётся ~3,5 ГиБ под KV-кэш, т.е. более 20 тысяч токенов контекста.
  vllm_memory_gib: 10.5
  # Предохранитель: доля памяти карты, выше которой vLLM не поднимается даже на карте меньше бюджета.
  max_utilization: 0.95

vllm:
  # Профиль runtime: Qwen3-8B AWQ, OpenAI-совместимый endpoint с tool calling.
  qwen:
    served_model_name: qwen3-8b
    port: 8000
    max_model_len: 16384
    max_num_seqs: 4
    tool_call_parser: hermes
    reasoning_parser: qwen3
  # Профиль ingest: dots.mocr для сканов (взаимоисключён с runtime — бюджет 12 ГиБ).
  dots:
    served_model_name: dots-mocr
    port: 8001
    max_model_len: 16384
    max_num_seqs: 2

models:
  # Общий каталог весов (bind-mount в контейнеры vLLM как /models). Загрузка — scripts/download_models.py,
  # рантайм работает офлайн (HF_HUB_OFFLINE=1). Ревизии — commit на Hugging Face (NFR-3, NFR-5).
  dir: models
  qwen:
    repo_id: Qwen/Qwen3-8B-AWQ
    revision: 4da05a8edb55c6046cce958586c33b61da07bb79
    local_name: Qwen3-8B-AWQ
  dots:
    repo_id: rednote-hilab/dots.mocr
    revision: e539fbb52280393adc081b289ec597430a0f9031
    # Без точки в имени каталога: требование модели (remote code не импортируется из пути с точкой).
    local_name: DotsMOCR
  embedding:
    repo_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    local_name: bge-m3
    # ONNX-копия весов (2,1 ГиБ) не нужна: инференс через transformers/sentence-transformers.
    ignore_patterns: ["onnx/*"]
  reranker:
    repo_id: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    local_name: bge-reranker-v2-m3
  # Модели нативного PDF-конвейера Docling (разметка страницы и структура таблиц). Без них Docling
  # качал бы их с HF при первом запуске (с ветки main); local_name обязан совпадать с тем, как Docling
  # ищет модель в artifacts_path: repo_id с «/» → «--».
  docling_layout:
    repo_id: docling-project/docling-layout-heron
    revision: 8f39ad3c0b4c58e9c2d2c84a38465abf757272d8
    local_name: docling-project--docling-layout-heron
  docling_tables:
    repo_id: docling-project/docling-models
    revision: fc0f2d45e2218ea24bce5045f58a389aed16dc23
    local_name: docling-project--docling-models

paths:
  # Распакованный архив экспорта (export/ с cards, cards_raw, files, manifest.json, links_graph.json).
  # До реального корпуса — синтетические фикстуры (задача 3.6).
  corpus_dir: data/corpus
  # Рабочие данные инжеста: кэш разбора Docling, отчёты.
  work_dir: data/work

embedding:
  # BAAI/bge-m3 (models.embedding): dense + sparse (lexical weights) из одной модели.
  dense_dim: 1024
  max_length: 8192
  batch_size: 16
  normalize: true
  # §2 ТЗ: в рантайме эмбеддинг запроса на CPU; при инжесте — на GPU после выгрузки dots.mocr.
  runtime_device: cpu
  ingest_device: cuda

reranker:
  # BAAI/bge-reranker-v2-m3 (models.reranker), CPU в рантайме (§2, N17).
  device: cpu
  max_length: 1024
  # Замер 2026-09-16 на 20 кандидатах реального индекса (CPU 12 потоков): батч 8 — 4,6 с, батч 4 — 3,2 с,
  # int8 + батч 4 — 1,5 с (оценки отличаются ≤ 0,002), bf16 — 21 с. Батч 4 и int8 — умолчание.
  batch_size: 4
  quantize_int8: true

qdrant:
  # child-чанки с векторами; parent-разделы — отдельная коллекция без векторов (возврат по parent_id)
  collection: documents
  parents_collection: documents_parents
  glossary_collection: glossary
  dense_vector: dense
  sparse_vector: sparse
  distance: Cosine
  upsert_batch_size: 64
  timeout_s: 30

ingest:
  # Форматы как в экспорте (N2): doc/xls пока не обрабатываются, остальное — в отчёт как «пропущено».
  extensions: [pdf, docx, xlsx, pptx, png, jpg, jpeg, tif, tiff, bmp, gif]
  # Маршрутизатор (FR-3): страница pdf с текстовым слоем короче порога считается сканом; документ идёт
  # в нативный конвейер, если доля страниц с текстовым слоем не меньше text_layer_min_page_share,
  # иначе целиком в VLM-конвейер с dots.mocr. Изображения — всегда VLM, docx/xlsx/pptx — всегда нативно.
  text_layer_min_chars_per_page: 50
  text_layer_min_page_share: 0.5
  # Мусорный текстовый слой от чужого OCR («прихOд прOдаха»): если среди слов страницы больше этой доли
  # содержат и кириллицу, и латиницу, страница считается сканом и идёт в dots.mocr.
  text_layer_max_mixed_script_share: 0.1
  # Разобранные DoclingDocument сохраняются в work_dir/parsed как JSON (ключ — sha256 файла и маршрут):
  # повторный прогон после смены чанкера не разбирает файлы заново.
  parse_cache: true
  vlm:
    # Docling VLM-конвейер (пресет dots_mocr) через OpenAI-совместимый endpoint профиля ingest.
    max_tokens: 8192
    # Страница pdf (72 dpi в точках) растеризуется с этим масштабом: 2.0 ≈ 144 dpi.
    image_scale: 2.0
    # Готовые изображения (jpg/png/tiff — уже 150–300 dpi) подаются как есть: увеличение раздувает
    # картинку сверх лимита модели, сервер её сжимает, и координаты разметки перестают совпадать.
    raster_image_scale: 1.0
    timeout_s: 600
  docling:
    # Нативный конвейер: разметка страницы (layout-heron) и таблицы (TableFormer) при инжесте
    # считаются на CPU — GPU в это время занят dots.mocr (§2). OCR Docling выключен: сканы идут в VLM.
    device: cpu
    num_threads: 4
    document_timeout_s: 600
    table_mode: accurate
    images_scale: 1.0
  files:
    # Правило файлов карточки — О5, docs/chunk_metadata_mapping.md п. 3.1 [ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ].
    # Никогда не индексируются печатные копии шаблона и служебные категории.
    never_index_name_prefixes: ["Для печати"]
    never_index_categories: ["Подписи ЭП", "Получено из Диадока"]
    # Основной файл документа (role=main, один на карточку) — первый подходящий по порядку.
    main_candidates:
      - {extension: docx, categories: ["Документ"]}
      - {extension: docx, categories: ["Файлы для отправки по ЭДО"]}
      - {extension: pdf, categories: ["Подписанные документы", "Документ"]}
      - {extension: docx, any_category: true}
      - {extension: pdf, any_category: true}
    # В этих категориях pdf при docx-оригинале — печатная/подписанная копия основного текста.
    main_text_categories: ["Документ", "Подписанные документы", "Файлы для отправки по ЭДО"]
    skip_pdf_duplicate_of_docx_main: true
    appendix_categories: ["Приложение"]
    # «Дополнительные сведения» (протоколы, уставы контрагентов, шаблоны) — только у приказов, где лежат ЛНА.
    supplement_categories: ["Дополнительные сведения"]
    supplement_card_types: [OrderMKC]
    # Файл с тем же sha256 в другой карточке индексируется один раз (владелец — лучшая роль, затем порядок манифеста).
    skip_cross_card_duplicates: true
  chunking:
    # FR-3: основной чанкер структурный (по DoclingDocument с хлебными крошками),
    # фоллбэк — фиксированный 512 токенов с перекрытием 64. Токены считаются токенайзером bge-m3.
    max_tokens: 512
    overlap_tokens: 64
    min_tokens: 24
    breadcrumb_separator: " → "
    # Нумерованный абзац из одного числа («1. Утверждение») не длиннее стольких слов — заголовок раздела,
    # длиннее — обычный пункт («1. Утвердить Положение…» в приказах со сквозной нумерацией).
    section_title_max_words: 8
    # Крошка из заголовка длиннее стольких слов обрезается (абзацы, ошибочно оформленные как заголовки).
    breadcrumb_max_words: 12
    # Приложения внутри документа (реальный корпус: «Приложение № 1» обычным абзацем без стиля заголовка):
    # абзац «Приложение № N» не длиннее appendix_max_words слов открывает раздел приложения, а следующие
    # за ним абзацы не длиннее appendix_title_max_words слов — его название в крошке.
    appendix_max_words: 12
    appendix_title_max_words: 20
    # Parent-child (FR-3): parent — раздел (все child-чанки под одним заголовком); раздел длиннее
    # этого лимита делится на несколько parent-окон подряд идущих чанков.
    parent_max_tokens: 2048
  # Статус документа для метаданных чанка и фильтра «только действующие» (О1 [ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ]).
  # То же правило, что в экспорт-скрипте: cancelled ⇔ StatusID в cancelled_status_ids или StateID
  # в cancelled_state_ids; иначе active ⇔ StateID в active_state_ids; иначе draft.
  status:
    cancelled_status_ids: ["de9d3b6d-532b-4cb8-aa7b-e055e8986e48"]   # StatusNameStatus = Отмененный
    cancelled_state_ids: [5, 17, 21]
    active_state_ids: [6, 8, 11, 12, 13, 18, 19]
    # Человекочитаемые имена состояний маршрута (StateID → имя) для approval_state_name; отсутствующие
    # id отдаются как есть (ключ локализации $KrStates_Doc_*).
    state_names:
      0: "Черновик"
      1: "На согласовании"
      2: "Согласован"
      3: "Не согласован"
      4: "На доработке"
      5: "Отменён"
      6: "Зарегистрирован"
      7: "На регистрации"
      8: "Подписан"
      9: "Отклонён"
      10: "На подписании"
      11: "На исполнении"
      12: "Исполнено"
      13: "Списан в дело"
      17: "Аннулирован"
      18: "Добавление скана"
      19: "На хранении"
      21: "На подтверждении аннулирования"
  # Parent-child: индексируется уровень пункта/абзаца, агенту возвращается родительский раздел.
  parent_level: section
  tables_as_separate_chunks: true

retrieval:
  # FR-2: prefetch dense и sparse → серверный RRF в Qdrant → rerank топ-20 на CPU → top_k агенту.
  prefetch_limit: 40
  rerank_candidates: 20
  top_k: 5
  max_top_k: 20
  # AC-2.2: без явного фильтра возвращаются только действующие документы.
  default_statuses: [active]
  # Вместе с найденным child-чанком агенту отдаётся текст его parent-раздела (FR-3 parent-child).
  return_parent: true
  # Значения фильтров «вид документа» и «подразделение» сверяются со списком из индекса без учёта
  # регистра и по вхождению («договор» → «Договорной документ»); список читается facet-запросом.
  known_values_limit: 500
  # get_document_content (FR-2.3): документ отдаётся parent-разделами по порядку (основной текст, затем
  # приложения) частями не больше стольких токенов (по счётчику инжеста) и разделов; дальше — next_offset.
  content_max_tokens: 4000
  content_max_sections: 40

glossary:
  # FR-5: глоссарий организации собирается из разделов документов уже построенного индекса
  # (scripts/run_ingest.py glossary или хвост обычного прогона при поднятом профиле runtime).
  enabled: true
  # Заголовок раздела сравнивается без учёта регистра, номера («2.») и кавычек: совпадение по вхождению,
  # поэтому «Раздел 2. Термины и определения» и «ТЕРМИНЫ, ОПРЕДЕЛЕНИЯ И СОКРАЩЕНИЯ» подходят оба.
  headings:
    - "термины и определения"
    - "термины, определения и сокращения"
    - "определения и сокращения"
    - "сокращения"
    - "используемые сокращения"
    - "перечень сокращений"
    - "основные понятия"
    - "глоссарий"
  # Кандидат «термин — определение» из строки перечня или строки таблицы: слева термин не длиннее
  # term_max_words слов, справа определение не короче definition_min_chars символов. Пороги отсекают
  # вводку «В настоящем Положении используются следующие термины:» и обычные пункты раздела.
  term_max_words: 6
  definition_min_chars: 12
  definition_max_chars: 600
  # Кандидаты одного раздела уходят в LLM одним сообщением; больше этого числа в реальных ЛНА не бывает.
  max_entries_per_section: 60
  # glossary_lookup: сколько записей отдаётся агенту и насколько похожим должен быть термин, найденный
  # векторами (точное совпадение ключа ищется раньше и порога не требует).
  lookup_top_k: 5
  match_ratio: 0.75

agent:
  llm:
    # Лимит генерации без размышлений и с ними (во втором случае в лимит входят и токены размышлений).
    max_tokens: 2048
    thinking_max_tokens: 6144
    timeout_s: 120
    max_retries: 2
    # Сэмплинг без размышлений (цикл инструментов, сводка диалога): Qwen рекомендует 0.7/0.8/20, но для
    # выбора инструментов важнее повторяемость — при 0.7 живые сценарии AC-2.1 проходили через раз
    # (2026-09-16), поэтому температура ниже; top_p/top_k — как у Qwen.
    sampling:
      temperature: 0.3
      top_p: 0.8
      top_k: 20
    thinking_sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
  # Режим размышлений Qwen3 по ролям LLM (решение заказчика 2026-09-16, N9): включён там, где вызывается
  # один раз на вопрос и даёт больше всего — разбор и переписывание запроса, итоговый ответ с самопроверкой;
  # выключен в цикле вызовов инструментов ради NFR-2 (каждый шаг цикла думал бы заново). Сравнение режимов
  # по метрикам M1–M8 и NFR-2 — на этапе 9.
  thinking:
    rewrite: true
    tool_loop: false
    answer: true
    verify: true
    summary: false
    # Подтверждение разделов глоссария: решение бинарное, строки уже выделены кодом — размышления не нужны,
    # а сборка идёт по всем разделам корпуса подряд (каждый шаг думал бы заново).
    glossary: false
  # FR-1: не более 8 вызовов инструментов на запрос.
  max_tool_calls: 8
  # Предохранители (секунды): один вызов инструмента MCP и весь цикл инструментов; цель по NFR-2 —
  # 45/120 с на ответ, это аварийные пределы.
  tool_timeout_s: 60
  loop_timeout_s: 240
  # Сколько текста результатов инструментов видит LLM в цикле (символы). Полные данные остаются в реестре
  # свидетельств для итогового ответа и цитат; дочитать раздел LLM может через get_document_content.
  # loop_context_chars — суммарный объём результатов инструментов за один вопрос: контекст Qwen3 16 384
  # токена, из них ~2 000 на системный промпт и вопрос и до max_tokens на ответ; при ~2,7 символа на токен
  # русского текста остаётся ~24 000 символов (живой прогон 2026-09-16: 14 337 токенов промпта → 400 от vLLM).
  # Когда остаток меньше context_reserve_chars, инструменты не вызываются, агент пишет заметки.
  tool_output:
    fragment_chars: 1000
    card_chars: 3000
    section_chars: 4000
    content_chars: 8000
    loop_context_chars: 24000
    context_reserve_chars: 1500
  # Итоговый ответ: бюджет свидетельств в промпте и длина контекста раздела при каждом фрагменте (символы).
  answer:
    evidence_max_chars: 20000
    context_chars: 1500
    # Пустой текст ответа (размышления съели весь thinking_max_tokens — живой прогон 2026-09-17, 55 с без
    # единого символа) — шаг повторяется столько раз, прежде чем отдать пустой ответ.
    empty_retries: 1
  # Проверка черновика ответа отдельным вызовом LLM с размышлениями (роль verify): модель находит предложения
  # с числом, временем, датой, названием или правилом, которых нет в тексте фрагмента по ссылке (или которые
  # выведены без явно показанного расчёта), а вычёркивает их детерминированный код — по предложению на
  # замечание, без переписывания; предложения с верным расчётом «12:45 + 45 мин = 13:30» защищены. Введено по
  # живым диалогам 2026-09-17: шаг ответа принимал вывод заметок цикла («не позднее 13:00») за факт документа и
  # подпирал его ссылками на фрагменты, где этого нет; проверяющий с правом переписывать сам дописывал примеры
  # и «исправлял» верный расчёт. Отказы не проверяются. Цена — один вызов на ответ. claim_match_ratio —
  # порог похожести замечания и предложения черновика (difflib), когда замечание не цитирует его дословно.
  # Если замечания отклонили весь черновик (вычёркивать нечего — текст опустел бы), шаг ответа повторяется
  # retry_answer раз с этими замечаниями в промпте; повторный черновик тоже проверяется.
  verify:
    enabled: true
    claim_match_ratio: 0.6
    retry_answer: 1
  memory:
    # FR-6: буфер последних сообщений (ход = вопрос + ответ); когда ходов больше или их суммарный объём
    # превышает summary_trigger_chars, старые ходы сжимаются LLM роли summary в сводку не длиннее
    # summary_max_words слов (сводка накапливается: прошлая сводка + сжимаемые ходы).
    buffer_messages: 10
    summary_trigger_chars: 12000
    summary_max_words: 250
  # FR-6: кэш документов, найденных в рамках сессии (реестр свидетельств; старые вытесняются по LRU).
  session_document_cache: 20
  # FR-6: уточняющий вопрос по уже найденному документу — его свидетельства из кэша сессии подаются в цикл
  # (не больше стольких символов, входят в loop_context_chars), и агент отвечает без нового поиска, если их достаточно.
  cached_evidence_chars: 4000
  # FR-6: переписывание вопроса с учётом истории в самодостаточный поисковый запрос (LLM роли rewrite);
  # в промпт попадают последние history_turns пар «вопрос — ответ», ответы обрезаются до answer_chars.
  rewrite:
    enabled: true
    history_turns: 5
    answer_chars: 800
  # FR-5 (б): аббревиатуры вопроса расшифровываются по глоссарию до поиска — расшифровка добавляется в
  # поисковый запрос. Термины называет шаг переписывания (`abbreviations`), плюс прописные сокращения
  # находит regexp; бюджет вызовов инструментов на это не тратится (глоссарий читается напрямую).
  glossary:
    enabled: true
    max_terms: 3
    definition_chars: 120

mcp:
  # FastMCP, транспорт streamable-http (N14).
  host: 0.0.0.0
  port: 8020
  path: /mcp

card_service:
  # Клиент сервиса карточек (FR-2.2, FR-2.4). URL и учётка — из окружения (CARD_SERVICE_*).
  timeout_s: 30
  # Кэш карточек: тип входящей связи восстанавливается из карточки-источника (N7), она берётся из кэша.
  cache_size: 256
  # get_document_card (FR-2.2, N21 [ТРЕБУЕТ ПОДТВЕРЖДЕНИЯ]): реальная карточка в JSON — медиана 170 КБ, до 575 КБ
  # (80 % — служебная секция маршрута KrStagesVirtual), целиком в контекст LLM не помещается. По умолчанию
  # инструмент отдаёт эти секции в форме CardData без переименований; full=true — карточку целиком.
  default_sections:
    - DocumentCommonInfo
    - OutgoingRefDocs
    - IncomingRefDocs
    - KrApprovalCommonInfoVirtual
    - Approv
    - ResponsibleErrand
    - Performers
    - DirectionActivityDCI

mock_card_service:
  # Мок сервиса карточек (§9 ТЗ): FastAPI с маршрутами и pydantic-схемами реального сервиса, данные
  # из архива экспорта (paths.corpus_dir). Порт тот же, что у сервиса заказчика по умолчанию (8010):
  # переключение мок ↔ реальный сервис — только CARD_SERVICE_URL. Запуск: python -m mocks.card_service.
  host: 0.0.0.0
  port: 8010
  # Представление справочника типов связей: строки собираются из связей экспорта (manifest, links_graph).
  # Реальные колонки представления Тессы по экспорту не проверялись (см. N20); MCP представления не использует.
  ref_type_view: RefType
  ref_type_columns: [RefTypeID, RefTypeName, RefTypeReverseName]

ui:
  # Chainlit.
  host: 0.0.0.0
  port: 8080
  title: "Поиск по документам СЭД"
  # После перезапуска стенда vLLM грузит модель ~40 с, а UI уже принимает вопросы (живой диалог 2026-09-17:
  # первый вопрос упал с «Connection error»). Перед вопросом UI проверяет готовность vLLM и, если модель ещё
  # загружается, ждёт до llm_ready_wait_s с шагом llm_ready_poll_s, показывая это шагом в чате.
  llm_ready_wait_s: 90
  llm_ready_poll_s: 3

langfuse:
  # Профиль observability включается флагом LANGFUSE_ENABLED в окружении; ключи там же.
  flush_interval_s: 1.0
  environment: dev

eval:
  golden_set: eval/golden_set.yaml
  reports_dir: eval/reports
  # NFR-2 / M6: первый видимый сигнал ≤ 5 с (p95).
  first_signal_budget_s: 5.0
  # LLM-судья (§10.2): та же Qwen3-8B отдельным промптом, без размышлений, температура 0 —
  # оценка должна быть воспроизводимой. Тексты процитированных фрагментов в промпте обрезаются,
  # чтобы вопрос с шестью ссылками помещался в контекст 16 384 токена вместе с ответом и эталоном.
  judge:
    temperature: 0.0
    max_tokens: 1024
    source_chars: 1200

logging:
  level: INFO
